name: blogify

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blogify}
      POSTGRES_USER: ${POSTGRES_USER:-blogify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blogify_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blogify} -d ${POSTGRES_DB:-blogify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: blogify-backend:${IMAGE_TAG:-local}
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blogify}:${POSTGRES_PASSWORD:-blogify_dev_password}@postgres:5432/${POSTGRES_DB:-blogify}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    image: blogify-backend:${IMAGE_TAG:-local}
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blogify}:${POSTGRES_PASSWORD:-blogify_dev_password}@postgres:5432/${POSTGRES_DB:-blogify}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    entrypoint: ['/bin/sh', '/etc/prometheus/start-prometheus.sh']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/start-prometheus.sh:/etc/prometheus/start-prometheus.sh:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  worker:
    image: blogify-backend:${IMAGE_TAG:-local}
    build: .
    command: ["python", "-m", "src.workers.blog_worker"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: blogify-worker
      WORKER_METRICS_PORT: 9101
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blogify}:${POSTGRES_PASSWORD:-blogify_dev_password}@postgres:5432/${POSTGRES_DB:-blogify}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "9101"

  reaper:
    image: blogify-backend:${IMAGE_TAG:-local}
    build: .
    command: ["python", "-m", "src.workers.reaper"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: blogify-reaper
      REAPER_METRICS_PORT: 9102
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blogify}:${POSTGRES_PASSWORD:-blogify_dev_password}@postgres:5432/${POSTGRES_DB:-blogify}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "9102"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on: [tempo]

volumes:
  tempo_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
