global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'blogify-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token

  - job_name: 'blogify-worker'
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9101
        refresh_interval: 15s

  - job_name: 'blogify-reaper'
    static_configs:
      - targets: ['reaper:9102']
