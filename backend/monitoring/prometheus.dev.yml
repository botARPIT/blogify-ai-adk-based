global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrapes the locally-running FastAPI (uvicorn) process.
  # host.docker.internal resolves to the host machine from inside a container
  # when extra_hosts: host.docker.internal:host-gateway is set (Docker >= 20.10).
  - job_name: 'blogify-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
