apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: ${ELASTICSEARCH_URL}
    basicAuth: true
    basicAuthUser: ${ELASTICSEARCH_GRAFANA_USERNAME}
    jsonData:
      index: filebeat-*
      interval: Daily
      timeField: '@timestamp'
      logMessageField: event
      logLevelField: level
      dataLinks:
        - datasourceUid: tempo
          field: trace_id
          url: '$${__value.raw}'
          title: View trace
    secureJsonData:
      basicAuthPassword: ${ELASTICSEARCH_GRAFANA_PASSWORD}
    editable: false
