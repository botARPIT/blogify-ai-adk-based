[project]
name = "blogify-ai-adk"
version = "1.0.0"
description = "Production-grade blog generation system with Google ADK"
authors = [{name = "Arpit", email = "arpit@blogify.dev"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.0",
    "pydantic==2.13.4",
    "email-validator==2.3.0",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "google-adk[extensions]==2.11.0",
    "google-genai==2.29.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "psycopg2-binary==2.9.12",
    "redis==8.0.1",
    "tavily-python==0.7.26",
    "prometheus-client==0.25.0",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "pypandoc==1.17",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "bcrypt==5.0.0",
    "PyJWT==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
evals = [
    "deepeval==4.3.1",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402", "UP042", "UP017", "W293"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Several test files intentionally share a basename across sibling trees
# (e.g. worker/test_worker_shutdown.py and lifecycle/test_worker_shutdown.py),
# so collect by fully-qualified path rather than by module basename.
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests requiring disposable external services",
    "eval: Evaluation tests",
    "slow: Slow tests",
]
