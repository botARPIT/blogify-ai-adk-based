# Dev monitoring-only override.
# Starts Prometheus, Grafana, and Tempo pointed at the locally-running API.
#
# Usage (from the backend/ directory):
#   docker compose -f docker-compose.base.yml -f docker-compose.monitoring.yml up -d prometheus grafana tempo
#
# This override:
#   1. Remounts prometheus.dev.yml (targets host.docker.internal:8000) instead of api:8000
#   2. Adds host.docker.internal -> host-gateway so containers reach the local uvicorn

services:
  prometheus:
    volumes:
      - ./monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    extra_hosts:
      - "host.docker.internal:host-gateway"
