# Single-server production stack, including Azure Linux VMs.
# docker compose --env-file .env.prod -f backend/docker-compose.prod.yml up -d --build --wait
# Local access: ssh -N -L 13001:127.0.0.1:3000 -L 19090:127.0.0.1:9090 azureuser@<vm-ip>
# One-time host/DNS setup and upgrades: docs/runbooks/azure-vm.md
name: blogify-prod

x-api-image: &api-image ${BACKEND_IMAGE:-blogify-backend:local}

x-api-env: &api-env
  ENVIRONMENT: prod
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  LLM_PROVIDER: ${LLM_PROVIDER:-google}
  LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://ollama.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
  GOOGLE_SEARCH_ENGINE_ID: ${GOOGLE_SEARCH_ENGINE_ID:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
  COOKIE_SECURE: "true"
  METRICS_PUBLIC: "false"
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Set METRICS_BEARER_TOKEN in the deployment secret store}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  # ── TLS / Reverse Proxy ──────────────────────────────────────────────────────
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs:ro
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/blogifyai-security-headers.conf:/etc/nginx/conf.d/blogifyai-security-headers.conf:ro
      - ./nginx/api.blogifyai.arpitdev.site:/etc/nginx/vhost.d/default:ro
    networks:
      - frontend
      - backend

  acme-companion:
    image: nginxproxy/acme-companion:2.4
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL}
    volumes:
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_data:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend

  migrate:
    image: *api-image
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      disable: true

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    image: *api-image
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: blogify-api
      # nginx-proxy auto-routes by these two vars
      VIRTUAL_HOST: ${API_DOMAIN:?Set API_DOMAIN}
      VIRTUAL_PORT: 8000
      LETSENCRYPT_HOST: ${API_DOMAIN:?Set API_DOMAIN}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - frontend
      - backend

  # ── Workers (3 replicas) ─────────────────────────────────────────────────────
  worker:
    image: *api-image
    build: .
    restart: unless-stopped
    command: python -m src.workers.blog_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: blogify-worker
      WORKER_METRICS_PORT: 9101
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "9101"
    networks:
      - backend

  # ── Reaper ───────────────────────────────────────────────────────────────────
  reaper:
    image: *api-image
    build: .
    restart: unless-stopped
    command: python -m src.workers.reaper
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: blogify-reaper
      REAPER_METRICS_PORT: 9102
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "9102"
    networks:
      - backend

  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Prometheus (internal only — SSH tunnel to access) ────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/prometheus/start-prometheus.sh']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/start-prometheus.sh:/etc/prometheus/start-prometheus.sh:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    expose:
      - "9090"
    networks:
      - backend

  # ── Grafana (internal only — SSH tunnel to access) ───────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    networks:
      - backend

  # ── Trace collection ────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4317"
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      - tempo
    expose:
      - "4317"
      - "4318"
      - "13133"
    networks:
      - backend

  # Host log shipping is intentionally delegated to the deployment platform.
  # The application stack only collects metrics and traces.
networks:
  frontend:
  backend:

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme_data:
